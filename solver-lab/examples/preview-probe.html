<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solver Lab 预览能力检查</title>
<style>body{font:16px/1.8 system-ui,sans-serif;max-width:680px;margin:30px auto;padding:16px;background:#f5f6f4;color:#213442}main{padding:24px;background:white;border:1px solid #cbd5d9;border-radius:12px}button,input{min-height:44px;font:inherit}button{padding:8px 16px}svg{display:block;width:100%;border:1px solid #dce3e2}#status{color:#a16207}label{display:block}</style></head>
<body><main><h1>教学页预览能力检查</h1><p>本页不访问网络，也不调用 AI。以下结果只描述当前预览环境。</p>
<p id="status">脚本尚未执行：若一直显示此行，不能声称计算或动画已运行。</p>
<svg viewBox="0 0 400 100" role="img" aria-label="SVG 显示与位置变化测试"><line x1="20" y1="65" x2="380" y2="65" stroke="#64748b"/><circle id="point" cx="20" cy="50" r="12" fill="#0d9488"/></svg>
<p>能看见圆点说明 SVG 可以显示。点击按钮和拖动时间轴，检查它是否移动。</p>
<button id="test">点击检查交互</button><span id="count"> 点击次数 0</span>
<label for="time">时间轴<input id="time" type="range" min="0" max="3" value="0" step="0.01"></label><p id="readout">位移 s = 0 m</p>
<p>预期：时间轴为 3 秒时，s = 9 m，圆点位于右端。若图、读数或按钮不工作，请下载 HTML 用浏览器打开，记录聊天平台、账号与日期。</p>
<noscript>当前环境禁用了 JavaScript。</noscript></main>
<script>let count=0;const time=document.getElementById('time');document.getElementById('status').textContent='内联 JavaScript 已执行；请继续手动检查按钮和时间轴。';document.getElementById('test').onclick=()=>document.getElementById('count').textContent=' 点击次数 '+(++count);time.oninput=()=>{const t=Number(time.value),s=t*t;document.getElementById('point').setAttribute('cx',20+s/9*360);document.getElementById('readout').textContent='位移 s = '+Number(s.toFixed(4))+' m';};</script></body></html>
